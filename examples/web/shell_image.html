<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Zenoo Sprite & Blend Modes Showcase (Spinel Wasm)</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    body {
      margin: 0;
      padding: 10px;
      background-color: #0d0f18;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      height: 100dvh;
      overflow: hidden;
      touch-action: none;
    }
    #header {
      margin-bottom: 8px;
      text-align: center;
      flex-shrink: 0;
    }
    h1 {
      margin: 0 0 4px 0;
      font-size: 18px;
      color: #ec4899;
      letter-spacing: 1px;
    }
    p {
      margin: 0;
      font-size: 11px;
      color: #8892b0;
    }
    #canvas-container {
      position: relative;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #233554;
      width: min(96vw, calc(72dvh * 16 / 9));
      height: min(calc(96vw * 9 / 16), 72dvh);
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #000;
      flex-shrink: 0;
    }
    canvas.emscripten {
      display: block;
      border: 0px none;
      background-color: #000;
      outline: none;
      width: 100% !important;
      height: 100% !important;
      touch-action: none;
    }
    #controls-bar {
      margin-top: 10px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-shrink: 0;
    }
    .btn {
      background: #1e293b;
      border: 1px solid #ec4899;
      color: #f43f5e;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }
    .btn:active {
      background: #ec4899;
      color: #0f172a;
    }
    .btn-back {
      border-color: #a855f7;
      color: #c084fc;
    }
    .btn-back:active {
      background: #c084fc;
      color: #0f172a;
    }
    #status {
      margin-top: 8px;
      font-size: 11px;
      color: #64ffda;
      flex-shrink: 0;
    }
    #portrait-hint {
      display: none;
    }
    @media (orientation: portrait) and (max-width: 600px) {
      #portrait-hint {
        display: block;
        margin-top: 6px;
        font-size: 11px;
        color: #facc15;
        background: rgba(250, 204, 21, 0.1);
        padding: 4px 10px;
        border-radius: 4px;
        border: 1px dashed rgba(250, 204, 21, 0.3);
      }
      #canvas-container {
        width: 98vw;
        height: calc(98vw * 9 / 16);
      }
    }
    @media (orientation: landscape) and (max-height: 550px) {
      body {
        padding: 0;
        justify-content: center;
      }
      #header, #status, #portrait-hint {
        display: none !important;
      }
      #canvas-container {
        width: min(100vw, calc(100dvh * 16 / 9));
        height: min(100dvh, calc(100vw * 9 / 16));
        max-width: 100vw;
        max-height: 100dvh;
        border-radius: 0;
        border: none;
      }
      #controls-bar {
        position: fixed;
        bottom: 8px;
        right: 8px;
        margin: 0;
        opacity: 0.3;
        transition: opacity 0.2s;
        z-index: 100;
      }
      #controls-bar:hover, #controls-bar:focus-within {
        opacity: 1.0;
      }
      .btn {
        padding: 6px 12px;
        font-size: 11px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(4px);
      }
    }
  </style>
</head>
<body>
  <div id="header">
    <h1>Zenoo: Sprite &amp; Blend Modes Showcase</h1>
    <p>Rotation / Scale / Flip / Pivot / offset_mode / Alpha / :alpha, :add, :multiply Blend</p>
    <div id="portrait-hint">スマートフォンは横向きにすると大画面で体験できます</div>
  </div>

  <div id="canvas-container">
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  </div>

  <div id="controls-bar">
    <a href="../" class="btn btn-back">← ポータルへ戻る (Portal)</a>
    <button class="btn" id="btn-fullscreen">全画面 (Fullscreen)</button>
  </div>

  <div id="status">Loading WebAssembly &amp; Assets...</div>

  <script type='text/javascript'>
    var statusElement = document.getElementById('status');
    var canvasElement = document.getElementById('canvas');
    var fullscreenBtn = document.getElementById('btn-fullscreen');

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        var el = document.getElementById('canvas-container');
        if (el.requestFullscreen) {
          el.requestFullscreen();
        } else if (el.webkitRequestFullscreen) {
          el.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    if (fullscreenBtn) {
      fullscreenBtn.addEventListener('click', toggleFullscreen);
    }

    var Module = {
      print: function(text) {
        console.log(text);
      },
      printErr: function(text) {
        console.error(text);
      },
      canvas: canvasElement,
      setStatus: function(text) {
        if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
        if (text === Module.setStatus.last.text) return;
        var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
        var now = Date.now();
        if (m && now - Module.setStatus.last.time < 30) return;
        Module.setStatus.last.time = now;
        Module.setStatus.last.text = text;
        if (text) {
          statusElement.innerHTML = text;
          statusElement.style.display = 'block';
        } else {
          statusElement.style.display = 'none';
        }
      },
      totalDependencies: 0,
      monitorRunDependencies: function(left) {
        this.totalDependencies = Math.max(this.totalDependencies, left);
        Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : 'All downloads clear.');
      }
    };
    Module.setStatus('Downloading...');
    window.onerror = function(event) {
      Module.setStatus('Exception thrown, see JavaScript console');
    };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
