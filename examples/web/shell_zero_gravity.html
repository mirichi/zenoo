<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Zenoo Zero-Gravity Immediate-Mode Physics (Spinel Wasm)</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    body {
      margin: 0;
      padding: 10px;
      background-color: #080c14;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      height: 100dvh;
      overflow: hidden;
      touch-action: none;
    }
    #header {
      margin-bottom: 8px;
      text-align: center;
      flex-shrink: 0;
    }
    h1 {
      margin: 0 0 4px 0;
      font-size: 18px;
      color: #38bdf8;
      letter-spacing: 1px;
    }
    p {
      margin: 0;
      font-size: 11px;
      color: #94a3b8;
    }
    #canvas-container {
      position: relative;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #1e293b;
      width: min(96vw, calc(72dvh * 16 / 9));
      height: min(calc(96vw * 9 / 16), 72dvh);
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #000;
      flex-shrink: 0;
    }
    canvas.emscripten {
      display: block;
      border: 0px none;
      background-color: #000;
      outline: none;
      width: 100% !important;
      height: 100% !important;
      touch-action: none;
    }
    #controls-bar {
      margin-top: 10px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-shrink: 0;
    }
    .btn {
      background: #0f172a;
      border: 1px solid #38bdf8;
      color: #38bdf8;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }
    .btn:active {
      background: #38bdf8;
      color: #0f172a;
    }
    .btn-back {
      border-color: #a855f7;
      color: #c084fc;
    }
    .btn-back:active {
      background: #c084fc;
      color: #0f172a;
    }
    #status {
      margin-top: 6px;
      font-size: 11px;
      color: #64748b;
      flex-shrink: 0;
    }
    #portrait-hint {
      display: none;
    }
    @media (orientation: portrait) {
      #portrait-hint {
        display: block;
        margin-top: 6px;
        font-size: 11px;
        color: #facc15;
        background: rgba(250, 204, 21, 0.1);
        padding: 4px 10px;
        border-radius: 4px;
        border: 1px dashed rgba(250, 204, 21, 0.3);
      }
      #canvas-container {
        width: 98vw;
        height: calc(98vw * 9 / 16);
      }
    }
    @media (orientation: landscape) and (max-height: 550px) {
      body {
        padding: 0;
        justify-content: center;
      }
      #header, #status, #portrait-hint {
        display: none !important;
      }
      #canvas-container {
        width: min(100vw, calc(100dvh * 16 / 9));
        height: min(100dvh, calc(100vw * 9 / 16));
        max-width: 100vw;
        max-height: 100dvh;
        border-radius: 0;
        border: none;
        box-shadow: none;
      }
      #controls-bar {
        position: fixed;
        top: 8px;
        right: 8px;
        left: 8px;
        margin-top: 0;
        justify-content: space-between;
        pointer-events: none;
        z-index: 9999;
      }
      #controls-bar > * {
        pointer-events: auto;
      }
      .btn {
        background: rgba(15, 23, 42, 0.75);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        padding: 6px 12px;
        font-size: 11px;
        border-radius: 20px;
        opacity: 0.75;
        transition: opacity 0.2s;
      }
      .btn:hover, .btn:active {
        opacity: 1.0;
      }
    }
  </style>
</head>
<body>
  <div id="header">
    <h1>ZENOO ZERO-GRAVITY 2D RIGID BODY PHYSICS</h1>
    <p>即時モード 2D 剛体物理シミュレーション (多角形・楕円・OBB・カプセル) (1280x720)</p>
  </div>
  <div id="canvas-container">
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1" width="1280" height="720"></canvas>
  </div>
  <div id="controls-bar">
    <a href="../" class="btn btn-back">← ポータルに戻る</a>
    <button class="btn" id="btn-fullscreen">全画面</button>
  </div>
  <div id="status">Loading WebAssembly module...</div>
  <div id="portrait-hint">📱 スマホを横向きにすると画面いっぱいに遊べます</div>

  <script type='text/javascript'>
    var statusElement = document.getElementById('status');
    var canvasElement = document.getElementById('canvas');

    function formatStatus(text) {
      if (!text) return '';
      var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
      if (m) {
        var prefix = m[1].trim();
        var loaded = parseFloat(m[2]);
        var total = parseInt(m[4], 10);
        if (total > 1000 || loaded > 1000) {
          if (total < loaded) total = loaded;
          var fmt = function(b) {
            if (b < 1024) return b + ' B';
            if (b < 1024 * 1024) return (b / 1024).toFixed(1) + ' KB';
            return (b / (1024 * 1024)).toFixed(1) + ' MB';
          };
          var pct = total > 0 ? Math.round((loaded / total) * 100) : 0;
          return prefix + ' ' + fmt(loaded) + ' / ' + fmt(total) + ' (' + pct + '%)';
        }
      }
      return text;
    }

    var Module = {
      print: function(text) { console.log(text); },
      printErr: function(text) { console.error(text); },
      canvas: canvasElement,
      setStatus: function(text) {
        if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
        if (text === Module.setStatus.last.text) return;
        Module.setStatus.last.text = text;
        statusElement.innerText = text ? formatStatus(text) : "[左ドラッグ]: 掴んで動かす/投げる | [右ドラッグ]: スピン回転 | [SPACE]: 拡散 | [S]: 停止 | [N]: 生成 | [C]: 消去 | [R]: リセット";
      },
      totalDependencies: 0,
      monitorRunDependencies: function(left) {
        this.totalDependencies = Math.max(this.totalDependencies, left);
        Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : 'All downloads clear.');
      }
    };
    Module.setStatus('Downloading...');
    window.onerror = function() {
      Module.setStatus('Exception thrown, see JavaScript console');
    };

    document.getElementById('btn-fullscreen').addEventListener('click', function() {
      var container = document.getElementById('canvas-container');
      if (!document.fullscreenElement) {
        if (container.requestFullscreen) {
          container.requestFullscreen();
        } else if (container.webkitRequestFullscreen) {
          container.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    });

    // ポインターキャプチャ (ドラッグ中に画面外・Canvas外に出てもイベントを逃さない)
    canvasElement.addEventListener('pointerdown', function(e) {
      try {
        canvasElement.setPointerCapture(e.pointerId);
      } catch (err) {}
    });
    canvasElement.addEventListener('pointerup', function(e) {
      try {
        canvasElement.releasePointerCapture(e.pointerId);
      } catch (err) {}
    });
    canvasElement.addEventListener('pointercancel', function(e) {
      try {
        canvasElement.releasePointerCapture(e.pointerId);
      } catch (err) {}
    });

    // Canvas外でのドラッグ中の mousemove 転送
    window.addEventListener('mousemove', function(e) {
      if (e.target !== canvasElement && e.buttons !== 0) {
        var ev = new MouseEvent('mousemove', {
          bubbles: true,
          cancelable: true,
          button: 0,
          buttons: e.buttons,
          clientX: e.clientX,
          clientY: e.clientY
        });
        canvasElement.dispatchEvent(ev);
      }
    });

    // Canvas外でのマウスリリース (mouseup) 転送
    window.addEventListener('mouseup', function(e) {
      if (e.target !== canvasElement) {
        var ev = new MouseEvent('mouseup', {
          bubbles: true,
          cancelable: true,
          button: e.button,
          buttons: e.buttons,
          clientX: e.clientX,
          clientY: e.clientY
        });
        canvasElement.dispatchEvent(ev);
      }
    });

    // ウィンドウフォーカス喪失時の安全リリース (blur)
    window.addEventListener('blur', function() {
      for (var b = 0; b < 3; b++) {
        var ev = new MouseEvent('mouseup', {
          bubbles: true,
          cancelable: true,
          button: b,
          buttons: 0
        });
        canvasElement.dispatchEvent(ev);
      }
    });

    window.addEventListener('resize', function() {
      window.scrollTo(0, 0);
    });
  </script>
  {{{ SCRIPT }}}
</body>
</html>
