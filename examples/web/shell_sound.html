<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Zenoo Audio & Sound Demo (Spinel Wasm)</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    body {
      margin: 0;
      padding: 10px;
      background-color: #0d0f18;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      height: 100dvh;
      overflow: hidden;
      touch-action: none;
    }
    #header {
      margin-bottom: 8px;
      text-align: center;
      flex-shrink: 0;
    }
    h1 {
      margin: 0 0 4px 0;
      font-size: 18px;
      color: #61afef;
      letter-spacing: 1px;
    }
    p {
      margin: 0;
      font-size: 11px;
      color: #8892b0;
    }
    #canvas-container {
      position: relative;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #233554;
      width: min(96vw, calc(72dvh * 16 / 9));
      height: min(calc(96vw * 9 / 16), 72dvh);
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #000;
      flex-shrink: 0;
    }
    canvas.emscripten {
      border: 0 none;
      background-color: #000;
      width: 100% !important;
      height: 100% !important;
      display: block;
      outline: none;
      touch-action: none;
    }
    #controls {
      margin-top: 8px;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-shrink: 0;
    }
    .btn {
      background: #1e222b;
      color: #abb2bf;
      border: 1px solid #3e4451;
      padding: 5px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn:hover {
      background: #282c34;
      color: #fff;
      border-color: #61afef;
    }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 14px;
      color: #61afef;
      text-align: center;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="header">
    <h1>Zenoo Audio & Sound Engine</h1>
    <p>miniaudio + stb_vorbis + SoundEffect (PCM Synthesis) on WebAssembly</p>
  </div>

  <div id="canvas-container">
    <div id="loading">Loading Wasm & Audio Assets...</div>
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  </div>

  <div id="controls">
    <a href="../index.html" class="btn">&larr; Portal</a>
    <button class="btn" onclick="toggleFullscreen()">Full Screen</button>
  </div>

  <script type='text/javascript'>
    var loadingElement = document.getElementById('loading');
    var canvasElement = document.getElementById('canvas');

    function toggleFullscreen() {
      var container = document.getElementById('canvas-container');
      if (!document.fullscreenElement) {
        if (container.requestFullscreen) {
          container.requestFullscreen();
        } else if (container.webkitRequestFullscreen) {
          container.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    // ブラウザの Web Audio API 自動再生ポリシー対応
    window.addEventListener('click', function() {
      if (typeof Module !== 'undefined' && Module.audioContext && Module.audioContext.state === 'suspended') {
        Module.audioContext.resume();
      }
    }, { once: false });

    var Module = {
      preRun: [],
      postRun: [function() {
        if (loadingElement) loadingElement.style.display = 'none';
      }],
      print: function(text) {
        console.log(text);
      },
      printErr: function(text) {
        console.error(text);
      },
      canvas: canvasElement,
      setStatus: function(text) {
        if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
        if (text === Module.setStatus.last.text) return;
        var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
        var now = Date.now();
        if (m && now - Module.setStatus.last.time < 30) return;
        Module.setStatus.last.time = now;
        Module.setStatus.last.text = text;
        if (loadingElement) {
          loadingElement.innerText = text;
          if (!text) loadingElement.style.display = 'none';
          else loadingElement.style.display = 'block';
        }
      },
      totalDependencies: 0,
      monitorRunDependencies: function(left) {
        this.totalDependencies = Math.max(this.totalDependencies, left);
        Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
      }
    };
    Module.setStatus('Downloading...');
    window.onerror = function(event) {
      Module.setStatus('Exception thrown, see JavaScript console');
      if (loadingElement) loadingElement.style.display = 'block';
    };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
