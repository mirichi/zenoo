<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Zenoo Multi-Window &amp; Occlusion Showcase (Spinel Wasm)</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #0d0f18;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: none;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
    }
    #header {
      margin-bottom: 6px;
      text-align: center;
      flex-shrink: 0;
    }
    h1 {
      margin: 0 0 2px 0;
      font-size: 17px;
      color: #00ffcc;
      letter-spacing: 1px;
    }
    p {
      margin: 0;
      font-size: 11px;
      color: #8892b0;
    }

    /* キャンバスコンテナ: アスペクト比を固定せず、空き領域の中で最大化 */
    #canvas-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: transparent;
      border-radius: 0;
      overflow: hidden;
      box-shadow: none;
      border: none;
      flex: 1 1 auto;
      min-width: 0;
      min-height: 0;
      width: 100%;
      max-width: 100%;
      max-height: 100%;
    }

    /* キャンバス: 解像度本来のアスペクト比を維持してコンテナ内にフィット */
    canvas.emscripten {
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      outline: none;
      background-color: #000;
      border: none;
      border-radius: 8px;
      box-shadow: 0 0 0 1px #233554, 0 10px 30px rgba(0, 0, 0, 0.8);
      touch-action: none;
    }

    /* コントロールバー */
    #controls-bar {
      margin-top: 8px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-shrink: 0;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn {
      background: #1e293b;
      border: 1px solid #38bdf8;
      color: #38bdf8;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      transition: background 0.15s, color 0.15s;
    }
    .btn:hover, .btn:active {
      background: #38bdf8;
      color: #0f172a;
    }
    .btn-back {
      border-color: #a855f7;
      color: #c084fc;
    }
    .btn-back:hover, .btn-back:active {
      background: #c084fc;
      color: #0f172a;
    }
    .btn-menu {
      border-color: #f59e0b;
      color: #fbbf24;
    }
    .btn-menu:hover, .btn-menu:active {
      background: #fbbf24;
      color: #0f172a;
    }

    #status {
      margin-top: 4px;
      font-size: 11px;
      color: #64ffda;
      flex-shrink: 0;
      min-height: 14px;
    }

    #portrait-hint {
      display: none;
    }

    /* 全画面表示用スタイル (:fullscreen / :-webkit-full-screen) */
    #canvas-container:fullscreen,
    #canvas-container:-webkit-full-screen {
      width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important;
      max-width: 100vw !important;
      max-height: 100dvh !important;
      border: none !important;
      border-radius: 0 !important;
      box-shadow: none !important;
      background-color: #000 !important;
    }
    #canvas-container:fullscreen canvas.emscripten,
    #canvas-container:-webkit-full-screen canvas.emscripten {
      max-width: 100vw !important;
      max-height: 100dvh !important;
      width: auto !important;
      height: auto !important;
      object-fit: contain !important;
      border: none !important;
      border-radius: 0 !important;
      box-shadow: none !important;
    }

    /* 全画面時のオーバーレイ解除ボタン */
    #btn-fullscreen-exit {
      display: none;
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 9999;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #fff;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 11px;
      cursor: pointer;
      opacity: 0.8;
      transition: opacity 0.2s;
    }
    #btn-fullscreen-exit:hover, #btn-fullscreen-exit:active {
      opacity: 1;
      background: rgba(239, 68, 68, 0.8);
      border-color: #ef4444;
    }
    #canvas-container:fullscreen #btn-fullscreen-exit,
    #canvas-container:-webkit-full-screen #btn-fullscreen-exit {
      display: block;
    }

    /* モバイル縦画面での案内表示 */
    @media (orientation: portrait) and (max-width: 600px) {
      #portrait-hint {
        display: block;
        margin-top: 4px;
        font-size: 11px;
        color: #facc15;
        background: rgba(250, 204, 21, 0.1);
        padding: 3px 8px;
        border-radius: 4px;
        border: 1px dashed rgba(250, 204, 21, 0.3);
      }
    }

    /* モバイル横画面時のUI省スペース化 */
    @media (orientation: landscape) and (max-height: 520px) {
      body {
        padding: 0;
        justify-content: center;
      }
      #header, #status, #portrait-hint {
        display: none !important;
      }
      #canvas-container {
        border-radius: 0;
        border: none;
        box-shadow: none;
        background-color: #000;
        width: 100vw;
        height: 100dvh;
        max-width: 100vw;
        max-height: 100dvh;
      }
      canvas.emscripten {
        border: none;
        border-radius: 0;
        box-shadow: none;
      }
      #controls-bar {
        position: fixed;
        top: 6px;
        right: 8px;
        left: 8px;
        margin-top: 0;
        justify-content: space-between;
        pointer-events: none;
        z-index: 9000;
      }
      #controls-bar > * {
        pointer-events: auto;
      }
      .btn {
        background: rgba(15, 23, 42, 0.75);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        padding: 4px 10px;
        font-size: 11px;
        border-radius: 16px;
        opacity: 0.75;
      }
      .btn:hover, .btn:active {
        opacity: 1.0;
      }
    }
  </style>
</head>
<body>
  <div id="header">
    <h1>ZENOO MULTI-WINDOW &amp; OCCLUSION SHOWCASE</h1>
    <p>GUI.window Floating Windows &amp; Hardware Clipping | Powered by Spinel AOT &amp; WebGL 2.0</p>
  </div>

  <div id="canvas-container" data-zenoo-touch-area>
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    <button id="btn-fullscreen-exit" data-zenoo-ui>✕ 全画面解除</button>
  </div>

  <div id="controls-bar" data-zenoo-ui>
    <a href="../" class="btn btn-back">← ポータルに戻る</a>
    
    <button class="btn" id="btn-fullscreen">全画面</button>
  </div>

  <div id="status">Loading WebAssembly module...</div>
  <div id="portrait-hint">📱 スマホを横向きにすると画面いっぱいで遊べます</div>

  <script type="text/javascript">
    var statusElement = document.getElementById('status');
    var canvasElement = document.getElementById('canvas');
    var containerElement = document.getElementById('canvas-container');

    // 読み込み進捗フォーマッタ
    function formatStatus(text) {
      if (!text) return '';
      var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
      if (m) {
        var prefix = m[1].trim();
        var loaded = parseFloat(m[2]);
        var total = parseInt(m[4], 10);
        if (total > 1000 || loaded > 1000) {
          if (loaded > total) total = loaded;
          var fmt = function(b) {
            if (b < 1024) return b + ' B';
            if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
            return (b / 1048576).toFixed(1) + ' MB';
          };
          var pct = total > 0 ? Math.round((loaded / total) * 100) : 0;
          return prefix + ' ' + fmt(loaded) + ' / ' + fmt(total) + ' (' + pct + '%)';
        }
      }
      return text;
    }

    var Module = {
      print: function(text) { console.log(text); },
      printErr: function(text) { console.error(text); },
      canvas: canvasElement,
      setStatus: function(text) {
        if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
        if (text === Module.setStatus.last.text) return;
        Module.setStatus.last.text = text;
        statusElement.innerText = text ? formatStatus(text) : 'Zenoo WebAssembly Ready';
      },
      totalDependencies: 0,
      monitorRunDependencies: function(left) {
        this.totalDependencies = Math.max(this.totalDependencies, left);
        Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')' : 'All downloads clear.');
      }
    };
    Module.setStatus('Downloading...');

    window.onerror = function() {
      Module.setStatus('Exception thrown, see JavaScript console');
    };

    // ----------------------------------------------------
    // 全画面表示制御 (Canvas Containerを全画面化)
    // ----------------------------------------------------
    function toggleFullscreen(e) {
      if (e) e.preventDefault();
      var fsElement = document.fullscreenElement || document.webkitFullscreenElement;
      if (!fsElement) {
        if (containerElement.requestFullscreen) {
          containerElement.requestFullscreen().catch(function(err) {});
        } else if (containerElement.webkitRequestFullscreen) {
          containerElement.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen().catch(function(err) {});
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    }

    function exitFullscreenIfActive() {
      if (document.fullscreenElement || document.webkitFullscreenElement) {
        if (document.exitFullscreen) {
          document.exitFullscreen().catch(function(){});
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    }

    var btnFullscreen = document.getElementById('btn-fullscreen');
    if (btnFullscreen) {
      btnFullscreen.addEventListener('click', toggleFullscreen);
      btnFullscreen.addEventListener('touchend', function(e) {
        e.stopPropagation();
      });
    }

    var btnFullscreenExit = document.getElementById('btn-fullscreen-exit');
    if (btnFullscreenExit) {
      btnFullscreenExit.addEventListener('click', toggleFullscreen);
      btnFullscreenExit.addEventListener('touchend', function(e) {
        e.stopPropagation();
      });
    }

    // MENUボタン (存在する場合: キャンバス中央での右クリックエミュレート)
    var btnMenu = document.getElementById('btn-menu');
    if (btnMenu) {
      btnMenu.addEventListener('click', function(e) {
        e.preventDefault();
        var rect = canvasElement.getBoundingClientRect();
        var cx = rect.left + rect.width / 2;
        var cy = rect.top + rect.height / 2;
        var pdown = new PointerEvent('pointerdown', { bubbles: true, cancelable: true, clientX: cx, clientY: cy, button: 2, buttons: 2, pointerType: 'mouse' });
        var pup = new PointerEvent('pointerup', { bubbles: true, cancelable: true, clientX: cx, clientY: cy, button: 2, buttons: 0, pointerType: 'mouse' });
        canvasElement.dispatchEvent(pdown);
        canvasElement.dispatchEvent(pup);
      });
    }

    // ----------------------------------------------------
    // 余白部分(containerElement)のマウス操作をCanvasへ転送
    // (マルチタッチ / IME / バイブレーション停止はZenoo本体側で自動処理)
    // ----------------------------------------------------
    function isUIElement(target) {
      return target && target.closest && target.closest('#controls-bar, #btn-fullscreen-exit');
    }

    function forwardPointerEventToCanvas(e) {
      if (e.target === canvasElement || isUIElement(e.target)) return;
      if (e.pointerType === 'touch') return;
      if (e.type === 'pointermove' && e.buttons === 0) return;
      var evt = new PointerEvent(e.type, {
        bubbles: true,
        cancelable: true,
        clientX: e.clientX,
        clientY: e.clientY,
        button: e.button,
        buttons: e.buttons,
        pointerId: e.pointerId,
        pointerType: e.pointerType || 'mouse'
      });
      canvasElement.dispatchEvent(evt);
    }
    containerElement.addEventListener('pointerdown', forwardPointerEventToCanvas);
    containerElement.addEventListener('pointerup', forwardPointerEventToCanvas);
    containerElement.addEventListener('pointermove', forwardPointerEventToCanvas);

    // ----------------------------------------------------
    // 全画面安全解除 (画面遷移時)
    // ----------------------------------------------------
    var backBtn = document.querySelector('.btn-back');
    if (backBtn) {
      backBtn.addEventListener('click', exitFullscreenIfActive);
      backBtn.addEventListener('touchend', function(e) {
        e.stopPropagation();
      });
    }
    window.addEventListener('pagehide', exitFullscreenIfActive);
    window.addEventListener('beforeunload', exitFullscreenIfActive);
  </script>
  {{{ SCRIPT }}}
</body>
</html>
