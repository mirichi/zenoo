<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Zenoo 2D Articulated Sprite &amp; Hierarchical Collision (Spinel Wasm)</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    body {
      margin: 0;
      padding: 10px;
      background-color: #0d0f18;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      height: 100dvh;
      overflow: hidden;
      touch-action: none;
    }
    #header {
      margin-bottom: 8px;
      text-align: center;
      flex-shrink: 0;
    }
    h1 {
      margin: 0 0 4px 0;
      font-size: 18px;
      color: #38bdf8;
      letter-spacing: 1px;
    }
    p {
      margin: 0;
      font-size: 11px;
      color: #8892b0;
    }
    #canvas-container {
      position: relative;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #1e293b;
      width: min(96vw, calc(72dvh * 16 / 9));
      height: min(calc(96vw * 9 / 16), 72dvh);
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #000;
      flex-shrink: 0;
    }
    canvas.emscripten {
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
      background-color: #101420;
    }
    #controls-bar {
      margin-top: 10px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-shrink: 0;
    }
    .btn {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      transition: all 0.2s;
    }
    .btn:hover {
      background: #334155;
      color: #fff;
    }
    .btn-back {
      background: #0f172a;
      border-color: #1e293b;
    }
    #status {
      margin-top: 6px;
      font-size: 11px;
      color: #64748b;
      min-height: 16px;
      flex-shrink: 0;
    }
    #portrait-hint {
      display: none;
      margin-top: 6px;
      font-size: 11px;
      color: #f59e0b;
      flex-shrink: 0;
    }
    @media (orientation: portrait) and (max-width: 768px) {
      #portrait-hint {
        display: block;
      }
    }
  </style>
</head>
<body>
  <div id="header">
    <h1>Zenoo 2D Articulated Sprite &amp; Hierarchy</h1>
    <p>Pure Ruby + WebGL 2.0 (Spinel AOT) | 2Dボーン・親子階層コライダー同期</p>
  </div>
  <div id="canvas-container">
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1" width="1280" height="720"></canvas>
  </div>
  <div id="controls-bar">
    <a href="../" class="btn btn-back">← ポータルに戻る</a>
    <button class="btn" id="btn-fullscreen">全画面</button>
  </div>
  <div id="status">Loading WebAssembly module...</div>
  <div id="portrait-hint">📱 スマホを横向きにすると画面いっぱいに遊べます</div>

  <script type='text/javascript'>
    var statusElement = document.getElementById('status');
    var canvasElement = document.getElementById('canvas');

    function formatStatus(text) {
      if (!text) return '';
      var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
      if (m) {
        var prefix = m[1].trim();
        var loaded = parseFloat(m[2]);
        var total = parseInt(m[4], 10);
        if (total > 1000 || loaded > 1000) {
          if (total < loaded) total = loaded;
          var fmt = function(b) {
            if (b < 1024) return b + ' B';
            if (b < 1024 * 1024) return (b / 1024).toFixed(1) + ' KB';
            return (b / (1024 * 1024)).toFixed(1) + ' MB';
          };
          var pct = total > 0 ? Math.round((loaded / total) * 100) : 0;
          return prefix + ' ' + fmt(loaded) + ' / ' + fmt(total) + ' (' + pct + '%)';
        }
      }
      return text;
    }

    var Module = {
      print: function(text) { console.log(text); },
      printErr: function(text) { console.error(text); },
      canvas: canvasElement,
      setStatus: function(text) {
        if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
        if (text === Module.setStatus.last.text) return;
        Module.setStatus.last.text = text;
        statusElement.innerText = text ? formatStatus(text) : "多関節スプライト & 階層衝突同期 デモ";
      },
      totalDependencies: 0,
      monitorRunDependencies: function(left) {
        this.totalDependencies = Math.max(this.totalDependencies, left);
        Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : 'All downloads clear.');
      }
    };
    Module.setStatus('Downloading...');
    window.onerror = function() {
      Module.setStatus('Exception thrown, see JavaScript console');
    };

    document.getElementById('btn-fullscreen').addEventListener('click', function() {
      var container = document.getElementById('canvas-container');
      if (!document.fullscreenElement) {
        if (container.requestFullscreen) {
          container.requestFullscreen();
        } else if (container.webkitRequestFullscreen) {
          container.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    });

    window.addEventListener('resize', function() {
      window.scrollTo(0, 0);
    });
  </script>
  <script async type="text/javascript" src="index.js"></script>
</body>
</html>
